name: Build & Push

on:
  push:
    branches: [main]

env:
  BACKEND_IMAGE: javdet/nib-backend
  FRONTEND_IMAGE: javdet/nib-frontend
  KB_IMAGE: javdet/nib-kb

jobs:
  # ---------------------------------------------------------------------------
  # Backend — Go build & tests
  # ---------------------------------------------------------------------------
  test-backend:
    name: Test backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Download modules
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./...

  # ---------------------------------------------------------------------------
  # Frontend — Bun lint, tests & build
  # ---------------------------------------------------------------------------
  test-frontend:
    name: Test frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  # ---------------------------------------------------------------------------
  # Docker — build & push both images once tests pass
  # ---------------------------------------------------------------------------
  push-images:
    name: Build & push images
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read version
        id: version
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.value }}
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.value }}
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      # Knowledge-base MCP server — same Go module as the backend, separate
      # binary and a distroless runtime (backend/Dockerfile.kb).
      - name: Build & push knowledge-base MCP
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.kb
          push: true
          tags: |
            ${{ env.KB_IMAGE }}:latest
            ${{ env.KB_IMAGE }}:${{ steps.version.outputs.value }}
            ${{ env.KB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=kb
          cache-to: type=gha,scope=kb,mode=max
