{{- if .Values.kbMcp.enabled }}
{{- $ctx := dict "component" "kb-mcp" "Chart" .Chart "Release" .Release "Values" .Values "Template" .Template }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nib.kbMcp.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nib.componentLabels" $ctx | nindent 4 }}
spec:
  type: {{ .Values.kbMcp.service.type }}
  ports:
    - name: http
      port: {{ .Values.kbMcp.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "nib.componentSelectorLabels" $ctx | nindent 4 }}
{{- end }}
