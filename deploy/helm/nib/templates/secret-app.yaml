{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nib.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nib.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_PASSWORD: {{ include "nib.postgresql.password" . | quote }}
  LLM_API_KEY: {{ .Values.secrets.llmApiKey | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  SECRETS_ENCRYPTION_KEY: {{ .Values.secrets.secretsEncryptionKey | quote }}
  ATLASSIAN_CLIENT_ID: {{ .Values.secrets.atlassianClientId | quote }}
  ATLASSIAN_CLIENT_SECRET: {{ .Values.secrets.atlassianClientSecret | quote }}
  EXECUTOR_LLM_API_KEY: {{ .Values.secrets.executorLlmApiKey | quote }}
  EXECUTOR_LLM_MODEL: {{ .Values.secrets.executorLlmModel | quote }}
  {{- if or .Values.backend.mcpServers .Values.kbMcp.enabled }}
  mcp.json: |
    {{- if .Values.backend.mcpServers }}
    {{- dict "mcpServers" .Values.backend.mcpServers | toJson | nindent 4 }}
    {{- else }}
    {{- include "nib.backend.defaultMcpServers" . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
