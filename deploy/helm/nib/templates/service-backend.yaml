{{- if .Values.backend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nib.backend.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- $ctx := dict "component" "backend" "Chart" .Chart "Release" .Release "Values" .Values "Template" .Template }}
    {{- include "nib.componentLabels" $ctx | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "nib.componentSelectorLabels" $ctx | nindent 4 }}
{{- end }}
