## Global chart settings
nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

## ServiceAccount for all NIB workloads
serviceAccount:
  create: true
  name: ""
  annotations: {}

## Application secrets (rendered as a Kubernetes Secret unless existingSecret is set).
## Never commit real values — pass via --set, -f values file, or External Secrets.
secrets:
  existingSecret: ""
  dbPassword: "nib"
  llmApiKey: ""
  openaiApiKey: ""
  ## Only when embeddings come from a different provider than completions.
  ## Empty falls back to llmApiKey.
  llmEmbeddingsApiKey: ""
  secretsEncryptionKey: ""
  executorLlmApiKey: ""
  executorLlmModel: ""
  ## Required unless backend.auth.insecureNoAuth: guards every /api/v1 route
  ## (the UI asks for it once). At least 32 characters: openssl rand -hex 32
  apiToken: ""
  ## Key each agent-runner Job's webhook token is signed with; a Job only ever
  ## sees its own token. Empty generates one on the backend data volume.
  agentWebhookToken: ""

## Backend — Go API server (javdet/nib-backend)
backend:
  enabled: true
  replicaCount: 1

  image:
    repository: javdet/nib-backend
  # tag: defaults to Chart.appVersion (e.g. v0.7.5)
    tag: ""
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8080

  ## Prometheus metrics.
  ##
  ## Served on a port of its own rather than a route on the API: the ingress
  ## below routes only the /api prefix to the backend, so this endpoint is not
  ## reachable from the public host. It is unauthenticated, like the rest of the
  ## API, and its metric names alone reveal plan counts, the configured model and
  ## cumulative LLM cost -- so anything that can reach the pod can read those.
  ## API authentication. The token itself is secrets.apiToken.
  auth:
    ## Run with no authentication at all. Only for a cluster nothing untrusted
    ## can reach; the backend refuses to start without a token otherwise.
    insecureNoAuth: false
    ## Origins (scheme://host[:port]) allowed to make cross-origin writes
    ## besides the API's own. Empty keeps the backend default (Vite dev server).
    allowedOrigins: []
    ## Host headers the API answers to (host or host:port). Empty serves any
    ## host; set it to your ingress host to block DNS rebinding.
    allowedHosts: []

  metrics:
    enabled: true
    port: 9090
    path: /metrics

    ## Add the metrics port to the backend Service. Needed for a ServiceMonitor
    ## and for any scraper that targets the Service rather than the pod.
    service:
      enabled: true

    ## ServiceMonitor for prometheus-operator. Off by default, and rendered only
    ## when the monitoring.coreos.com/v1 API is actually present in the cluster.
    serviceMonitor:
      enabled: false
      ## Namespace to create it in. Empty means the release namespace.
      namespace: ""
      interval: 30s
      scrapeTimeout: 10s
      ## Extra labels, for a Prometheus whose serviceMonitorSelector needs them.
      additionalLabels: {}
      relabelings: []
      metricRelabelings: []

  ## Application config (rendered into config.yaml ConfigMap).
  ## knowledge_base.uri is omitted by default; DB connection uses DB_* env from Secret.
  config:
    llm:
      baseURL: https://api.openai.com/v1
      ## gpt-5.6 is an alias for gpt-5.6-sol; use gpt-5.6-terra / gpt-5.6-luna for lower cost.
      model: gpt-5.6
      ## OpenAI platform embedding ids have no provider prefix; must match
      ## kb_collections.embedding_model exactly.
      embeddingModel: text-embedding-3-small
      ## Completion endpoint: chat (/v1/chat/completions) or responses (/v1/responses).
      ## gpt-5.6 needs responses to combine function tools with reasoning.
      api: responses
      ## Allowed: none, minimal, low, medium, high, xhigh.
      ## Sent on every completion whatever the model is. Clear it for a
      ## provider that rejects the parameter (Grok, Kimi) or accepts a
      ## narrower set (Gemini). An explicit "" overrides LLM_REASONING_EFFORT.
      reasoningEffort: medium
      timeoutSeconds: 300
      ## Embeddings endpoint. Each field falls back to the llm.* value above,
      ## so omitting the block keeps one provider serving both. Set baseURL
      ## when the completion provider serves no /embeddings route (DeepSeek,
      ## xAI, Kimi); set dimensions when the model is not natively 1536 wide
      ## (Gemini 3072, Qwen 1024). The key, when it differs, is the
      ## llmEmbeddingsApiKey secret. Must agree with kbMcp.embeddings below.
      ## See docs/how-to/switch-llm-provider.md#provider-presets
      # embeddings:
      #   baseURL: https://api.openai.com/v1
      #   model: text-embedding-3-small
      #   dimensions: 1536
      ## OpenRouter-only attribution headers; ignored by the OpenAI platform.
      httpReferer: ""
      appTitle: ""
    log:
      enabled: true
      file: /app/data/logs/llmchat.stderr.log
      level: info
    agent:
      maxIterations: 30
    skills:
      dir: /app/data/skills
    rules:
      dir: /app/data/rules
    prompts:
      dir: /app/data/prompts
    includedTools:
      dir: /app/data/tools
    projects: []

  ## Raw YAML replaces the templated config above when set.
  configOverride: ""

  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
    existingClaim: ""
    accessModes:
      - ReadWriteOnce

  ## Optional ConfigMap with prompts/tools/rules/skills to copy into /app/data on first start.
  dataSeed:
    configMapName: ""

  ## Optional mcp.json bootstrap (copied only when absent in the PVC).
  ## When empty and kbMcp.enabled, defaults to knowledge-base pointing at the in-cluster kb-mcp Service.
  mcpServers: {}

  ## Mount host Docker socket for local executor (run_executor tool). Not recommended in production.
  dockerSocket:
    enabled: false

  ## For an annotation-based scraper, instead of the ServiceMonitor above:
  ##   prometheus.io/scrape: "true"
  ##   prometheus.io/port: "9090"
  ##   prometheus.io/path: "/metrics"
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext: {}
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

  probes:
    liveness:
      enabled: true
      initialDelaySeconds: 60
      periodSeconds: 15
      timeoutSeconds: 3
      failureThreshold: 10
    readiness:
      enabled: true
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3

## Frontend — nginx SPA (javdet/nib-frontend)
frontend:
  enabled: true
  replicaCount: 1

  image:
    repository: javdet/nib-frontend
    tag: ""
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 80

  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext: {}
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

  probes:
    liveness:
      enabled: true
      initialDelaySeconds: 5
      periodSeconds: 30
      timeoutSeconds: 3
      failureThreshold: 3
    readiness:
      enabled: true
      initialDelaySeconds: 3
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3

## Knowledge-base MCP server (javdet/nib-kb)
kbMcp:
  enabled: true
  replicaCount: 1

  image:
    repository: javdet/nib-kb
    tag: "0.8.1"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8081

  ## The kb CLI "openrouter" provider is a generic OpenAI-compatible
  ## /embeddings client; point it at any provider and reuse LLM_API_KEY.
  ##
  ## This container embeds the queries that search the chunks the backend
  ## ingested, so both fields must agree with backend.config.llm.embeddings.
  ## A width mismatch returns no search results and reports no error.
  embeddings:
    baseURL: https://api.openai.com/v1
    ## Empty omits the parameter. Set to 1536 whenever the backend sets it.
    dimensions: ""

  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext: {}
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

  probes:
    liveness:
      enabled: true
      initialDelaySeconds: 15
      periodSeconds: 20
      timeoutSeconds: 3
      failureThreshold: 3
    readiness:
      enabled: true
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3

## Bundled PostgreSQL with pgvector extension
postgresql:
  enabled: true

  image:
    repository: pgvector/pgvector
    tag: pg18
    pullPolicy: IfNotPresent

  auth:
    username: nib
    password: ""
    database: nib
    sslmode: disable

  service:
    port: 5432

  persistence:
    size: 10Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce

  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext: {}
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

  probes:
    liveness:
      enabled: true
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
    readiness:
      enabled: true
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3

## External PostgreSQL (used when postgresql.enabled is false)
externalDatabase:
  host: ""
  port: 5432
  username: nib
  password: ""
  database: nib
  sslmode: disable

## Ingress — routes traffic to the frontend Service (nginx proxies /api/ to backend).
## Set routeApiToBackend: true to send /api directly to the backend Service instead.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: nib.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  routeApiToBackend: false
