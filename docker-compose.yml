# Production stack — published images from Docker Hub.
#
#   cp .env.example .env
#   # set LLM_API_KEY (required)
#   docker compose up -d
#   # UI: http://localhost:${NIB_HTTP_PORT:-8080}
#
# Images are built and pushed by .github/workflows/build.yml on every push to
# main. Pin NIB_VERSION / NIB_KB_VERSION in .env to avoid surprise upgrades.
#
# For local development against source (live reload), use:
#   docker compose -f docker-compose.dev.yml up

name: nib

services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: nib-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nib}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nib}
      POSTGRES_DB: ${POSTGRES_DB:-nib}
    volumes:
      - pgdata:/var/lib/postgresql
      # Creates the pgvector extension on a fresh data dir, before the backend's
      # first connection tries to register the vector types.
      - ./deploy/compose/initdb.sql:/docker-entrypoint-initdb.d/00-vector.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-nib} -d ${POSTGRES_DB:-nib}",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - nib

  kb-mcp:
    image: javdet/nib-kb:v0.8.0
    container_name: nib-kb-mcp
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/usr/local/bin/kb"]
    command:
      - serve-mcp
      - -transport
      - http
      - -http-addr
      - ":8081"
      - -http-path
      - /mcp
      # "openrouter" is the kb CLI name for any OpenAI-compatible /embeddings client.
      - -provider
      - openrouter
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nib}:${POSTGRES_PASSWORD:-nib}@postgres:5432/${POSTGRES_DB:-nib}?sslmode=disable
      OPENROUTER_API_KEY: ${LLM_API_KEY:-${OPENAI_API_KEY:-}}
      EMBEDDINGS_BASE_URL: ${KB_EMBEDDINGS_BASE_URL:-https://api.openai.com/v1}
      # Must match LLM_EMBEDDINGS_DIMENSIONS: this container embeds the queries
      # that search the chunks the backend ingested.
      EMBEDDINGS_DIMENSIONS: ${KB_EMBEDDINGS_DIMENSIONS:-}
    # Reached only over the internal network at http://kb-mcp:8081/mcp
    # (see deploy/compose/mcp.json). No host port needed.
    networks:
      - nib

  backend:
    image: javdet/nib-backend:v0.8.0
    container_name: nib-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kb-mcp:
        condition: service_started
    ports:
      # Optional direct API access (debugging, OAuth without the SPA proxy).
      - "${NIB_BACKEND_PORT:-8081}:8080"
      # /metrics is unauthenticated, so publishing it to the host is opt-in:
      # leave NIB_METRICS_PORT unset to keep it inside the compose network.
      - "${NIB_METRICS_PORT:-9090}:9090"
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      METRICS_PORT: 9090
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-nib}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-nib}
      DB_NAME: ${POSTGRES_DB:-nib}
      DB_SSLMODE: disable
      MIGRATIONS_PATH: /app/migrations
      DATA_DIR: /app/data
      # Secrets — set in .env, never in config.yaml.
      LLM_API_KEY: ${LLM_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_API: ${LLM_API:-}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-}
      # Embeddings endpoint, when it is not the completion host. Each falls
      # back to the matching LLM_* value when empty.
      LLM_EMBEDDINGS_BASE_URL: ${LLM_EMBEDDINGS_BASE_URL:-}
      LLM_EMBEDDINGS_API_KEY: ${LLM_EMBEDDINGS_API_KEY:-}
      LLM_EMBEDDINGS_MODEL: ${LLM_EMBEDDINGS_MODEL:-}
      LLM_EMBEDDINGS_DIMENSIONS: ${LLM_EMBEDDINGS_DIMENSIONS:-}
      EXECUTOR_LLM_API_KEY: ${EXECUTOR_LLM_API_KEY:-}
      EXECUTOR_LLM_MODEL: ${EXECUTOR_LLM_MODEL:-}
      AGENT_WEBHOOK_TOKEN: ${AGENT_WEBHOOK_TOKEN:-}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-}
      APP_VERSION: ${APP_VERSION:-${NIB_VERSION:-dev}}
      # The local executor launches agent-runner via the host Docker daemon.
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      # Persistent data volume. Created empty by compose on first `up`; the
      # image entrypoint builds the directory layout inside it and seeds
      # mcp.json. Survives `docker compose down` — remove with `down -v`.
      - nibdata:/app/data
      # Overrides the config.yaml baked into the image (which points at
      # localhost and ships example projects).
      - ./deploy/compose/config.yaml:/app/config.yaml:ro
      # Remove this if you do not use the local Docker executor.
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/v1/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 10
      start_period: 60s
    networks:
      - nib

  frontend:
    image: javdet/nib-frontend:v0.8.0
    container_name: nib-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${NIB_HTTP_PORT:-8080}:80"
    environment:
      API_UPSTREAM: http://backend:8080
    networks:
      - nib

  github-mcp:
    image: ghcr.io/github/github-mcp-server:latest
    restart: unless-stopped
    command:
      - http
      - --port=9082
    networks:
      - nib

  aws-mcp:
    image: public.ecr.aws/awslabs-mcp/awslabs/aws-api-mcp-server:latest
    restart: unless-stopped
    environment:
      AWS_API_MCP_TRANSPORT: "streamable-http"
      AWS_API_MCP_HOST: "0.0.0.0"
      AWS_API_MCP_PORT: "9081"
      AUTH_TYPE: "no-auth"
      AWS_REGION: "${AWS_REGION:-us-east-2}"
      AWS_API_MCP_ALLOWED_HOSTS: "aws-mcp,localhost,127.0.0.1"
      AWS_API_MCP_ALLOWED_ORIGINS: "aws-mcp,localhost,127.0.0.1"
      READ_OPERATIONS_ONLY: "false"
      REQUIRE_MUTATION_CONSENT: "false"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    networks:
      - nib

  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_PORT: "9083"
      SEARXNG_BASE_URL: "http://searxng:9083/"
      SEARXNG_SECRET: "${SEARXNG_SECRET}"
    volumes:
      - ./searxng:/etc/searxng:rw
    networks:
      - nib


  searxng-mcp:
    image: docker.io/isokoliuk/mcp-searxng:latest
    container_name: searxng-mcp
    restart: unless-stopped
    environment:
      SEARXNG_URL: "http://searxng:9083"
      SEARXNG_DEFAULT_RESPONSE_FORMAT: "json"
      SEARXNG_MAX_RESULT_CHARS: "500"
      SEARXNG_TIMEOUT_MS: "15000"
      MCP_HTTP_PORT: "9084"
      MCP_HTTP_HOST: "0.0.0.0"
      MCP_HTTP_STATELESS: "true"
    networks:
      - nib

volumes:
  pgdata:
    name: nib-pgdata
  nibdata:
    name: nib-data

networks:
  nib:
    name: nib
